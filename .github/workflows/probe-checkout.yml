name: Probe checkout

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Checkout or invoice URL to open (not printed)"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Open the URL like a buyer would
        env:
          PROBE_URL: ${{ inputs.url }}
        run: |
          echo "::add-mask::$PROBE_URL"
          python3 .github/probe_checkout.py
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-probe
          path: probe-out/
          retention-days: 3
